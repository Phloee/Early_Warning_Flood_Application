<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakairta – Developer Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #1C1C1E;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 380px;
      padding: 0 24px;
    }

    .logo-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: #3478F6;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .logo-icon svg {
      width: 32px;
      height: 32px;
      fill: #fff;
    }

    .logo-name {
      color: #fff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .logo-sub {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      margin-top: 4px;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card {
      background: #2C2C2E;
      border-radius: 20px;
      padding: 32px 28px;
    }

    .card-title {
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .error-box {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 10px;
      padding: 12px 14px;
      color: rgba(239,68,68,0.9);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 13px 14px;
      color: #fff;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #3478F6;
      box-shadow: 0 0 0 3px rgba(52,120,246,0.15);
    }

    input::placeholder { color: rgba(255,255,255,0.2); }

    .btn {
      width: 100%;
      padding: 14px;
      background: #3478F6;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }

    .footer {
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.2);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-block">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 1.82.487 3.53 1.338 5.004L12 22l8.662-4.996A9.956 9.956 0 0022 12c0-5.523-4.477-10-10-10zm0 14c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
        </svg>
      </div>
      <div class="logo-name">Jakairta</div>
      <div class="logo-sub">Developer Command Center</div>
    </div>

    <div class="card">
      <div class="card-title">Masuk</div>

      {% if error %}
      <div class="error-box">{{ error }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="admin@admin.com" required autofocus>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn">Masuk</button>
      </form>
    </div>

    <p class="footer">Hanya untuk Developer dan Admin Sistem</p>
  </div>
</body>
</html>
